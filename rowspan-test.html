<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sankalan Rowspan Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      max-width: 800px;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eaeaea;
    }
  </style>
</head>

<body>

  <h1>Sankalan Rowspan Test</h1>

  <table>
    <thead>
      <tr>
        <th>Country</th>
        <th>City</th>
        <th>Population</th>
      </tr>
    </thead>

    <tbody>

      <tr>
        <td rowspan="2">Nepal</td>
        <td>Kathmandu</td>
        <td>1,000,000</td>
      </tr>

      <tr>
        <td>Pokhara</td>
        <td>500,000</td>
      </tr>

      <tr>
        <td rowspan="3">India</td>
        <td>Delhi</td>
        <td>20,000,000</td>
      </tr>

      <tr>
        <td>Mumbai</td>
        <td>18,000,000</td>
      </tr>

      <tr>
        <td>Bengaluru</td>
        <td>12,000,000</td>
      </tr>

      <tr>
        <td rowspan="2">Bangladesh</td>
        <td>Dhaka</td>
        <td>10,000,000</td>
      </tr>

      <tr>
        <td>Chattogram</td>
        <td>4,000,000</td>
      </tr>

    </tbody>
  </table>

</body>
</html>
